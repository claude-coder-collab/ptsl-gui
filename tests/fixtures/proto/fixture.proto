// Hand-written fixture for PTSL GUI tests. It imitates the structure of a PTSL-style
// protocol definition but contains no SDK content.
syntax = "proto3";

package ptsl;

enum CommandId
{
	// @cond hidden_from_doxygen
	reserved 7;
	option allow_alias = true;
	/// @endcond
	/**
	 * RemovedThing is gone.
	 */
	reserved "RemovedThing";

	/**
	 * @deprecated use CId_MakeWidget
	 */
	MakeWidget = 0;
	/**
	 * Makes a new widget.
	 * Spans two lines.
	 *
	 * @request_body_type MakeWidgetRequestBody
	 *
	 * Simple widget.
	 * @request_body_json_example
	 * {
	 * 	"name": "w1",
	 * 	"size": 3
	 * }
	 * @end_example
	 *
	 * A coloured widget,
	 * with a caption on two lines.
	 * @request_body_json_example
	 * {
	 *   "name": "w2",
	 *   "colour": "WColour_Red",
	 * }
	 *
	 * # trailing commas are tolerated
	 * @end_example
	 *
	 * @response_body_type MakeWidgetResponseBody
	 * @response_body_json_example
	 * {
	 *   "widget_id": "abc"
	 *   "created": true
	 * }
	 * @end_example
	 *
	 * @category_widgets
	 * @category_all
	 *
	 * @since Widget Host 2023.3
	 */
	CId_MakeWidget = 0;

	/**
	 * @brief Lists widgets.
	 *
	 * @details Returns all widgets. Kinds:
	 *
	 * - Round
	 * -# has no corners
	 * - Square
	 *
	 * @note Results are paged.
	 * Use the pagination fields.
	 *
	 * TODO add response example
	 *
	 * @sa MakeWidget
	 *
	 * @category_widgets
	 * @category_queries
	 * @category_all
	 *
	 * @since Widget Host 2024.1.2
	 */
	CId_ListWidgets = 1;

	/**
	 * Pings the host.
	 *
	 * @category_utility
	 * @category_all
	 */
	CId_Ping = 2;

	/**
	 * Deletes a widget.
	 *
	 * @request_body_type DeletWidgetRequestBody
	 * @request_body_json_example
	 * {
	 *   "names": ["a", ...]
	 * }
	 * @end_example
	 *
	 * @deprecated since Widget Host 2025.1, use CId_MakeWidget with size 0
	 * @category_widgets
	 * @category_editing
	 * @category_all
	 * @since Widget Host 2023.3
	 */
	CId_DeleteWidget = 3;
	OldDeleteWidget = 3;
	AncientDeleteWidget = 3;

	CId_GetPTSLVersion = 4;

	/**
	 * Undoes the last edit.
	 *
	 * @request_body_type UndoRequestBody
	 *
	 * @category_editing
	 * @category_all
	 *
	 * @since Widget Host 2024.6
	 */
	CId_Undo = 5;

	/**
	 * Redoes the last undone edit.
	 *
	 * @request_body_type RedoRequestBody
	 *
	 * @category_editing
	 * @category_all
	 *
	 * @since Widget Host 2024.6
	 */
	CId_Redo = 6;

	/**
	 * Selects a time range.
	 *
	 * @request_body_type SetSelectionRequestBody
	 *
	 * @category_widgets
	 * @category_all
	 *
	 * @since Widget Host 2024.6
	 */
	CId_SetSelection = 8;

	CId_None = -1;
}

enum WidgetColour
{
	option allow_alias = true;

	WColour_None = 0;
	/**
	 * @deprecated use WColour_Red
	 */
	Red = 1;
	/**
	 * A warm colour.
	 */
	WColour_Red = 1;
	WColour_Green = 2;
}

message Geometry
{
	enum Unit
	{
		option allow_alias = true;

		Unit_None = 0;
		// @deprecated use Unit_Mm
		Mm = 1;
		Unit_Mm = 1; // Millimetres.
	}

	double width = 1;
	double height = 2;
	Unit unit = 3;
}

// Request for making a widget.
message MakeWidgetRequestBody
{
	// Display name of the widget.
	string name = 1;
	int32 size = 2; // Edge length in units.
	WidgetColour colour = 3;
	bool visible = 4;
	Geometry geometry = 5;
	repeated string tags = 6;
	repeated Geometry parts = 7;
	oneof placement
	{
		string folder = 8;
		int64 slot = 9;
	}
	map<string, string> attributes = 10;
	optional float opacity = 11;
	bytes payload = 12;
	uint32 count = 13;
}

message MakeWidgetResponseBody
{
	string widget_id = 1;
	bool created = 2;
}

message ListWidgetsRequestBody
{
	int32 limit = 1;
	int32 offset = 2;
}

message ListWidgetsResponseBody
{
	repeated MakeWidgetRequestBody widgets = 1;
}

message DeleteWidgetRequestBody
{
	repeated string names = 1;
}

message UndoRequestBody
{
	int32 levels = 1;
}

message RedoRequestBody
{
	int32 levels = 1;
}

enum TimelineLocationType
{
	TLType_Unknown = 0;
	TLType_Samples = 1;
	// Clock time, MM:SS.mmm.
	TLType_MinSecs = 4;
	TLType_TimeCode = 5;
	TLType_BarsBeats = 6;
	TLType_FeetFrames = 7;
	TLType_Seconds = 8;
}

message TimelineLocation
{
	string location = 1;
	TimelineLocationType time_type = 2;
}

message SetSelectionRequestBody
{
	string in_time = 1;
	string out_time = 2;
	string session_location = 3;
	TimelineLocationType location_type = 4;
	TimelineLocation play_start = 5;
}
