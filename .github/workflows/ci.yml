name: CI

on:
  pull_request:

jobs:
  python-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q tests/tools

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: pip install clang-format==23.1.2
      - run: git ls-files -z -- '*.cpp' '*.hpp' | xargs -0 clang-format --dry-run --Werror

  core:
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-14 cmake \
            libprotobuf-dev libprotoc-dev protobuf-compiler nlohmann-json3-dev catch2
      - run: cmake --preset ci
      - run: cmake --build --preset ci
      - run: ctest --preset ci
